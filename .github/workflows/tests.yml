name: Tests and Code Quality

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webtics
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: webtics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run linting (Ruff)
        run: |
          cd backend
          ruff check app/ --output-format=github
        continue-on-error: true

      - name: Run code formatting check (Black)
        run: |
          cd backend
          black --check app/
        continue-on-error: true

      - name: Run type checking (MyPy)
        run: |
          cd backend
          mypy app/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://webtics:test_password@localhost:5432/webtics_test
          ENVIRONMENT: development
          WEBTICS_API_KEY: test_api_key_for_ci
          SECRET_KEY: test_secret_key_for_ci
          WITHDRAWAL_SECRET_KEY: test_withdrawal_key_for_ci
          ALLOWED_ORIGINS: http://localhost:3000
          LOG_LEVEL: INFO
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: unittests
          name: codecov-webtics
        continue-on-error: true

      - name: Test summary
        run: |
          echo "✅ Tests completed successfully!"
