<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ student_brand }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="leaf">&#127807;</span> {{ student_brand }}
      <small>powered by {{ service_brand }}</small>
    </div>
    <nav class="nav">
      <a href="/app/">Home</a>
      <a href="/app/docs">Docs</a>
      <a href="/app/dashboard">Dashboard</a>
      <a href="#" onclick="WT.logout();return false;">Log out</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/portal.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
